[game]
name = "Mighty Final Fight"
output_prefix = "mff"
# the P0 map gives the entry points; the finder's pointer and secondary scans decode data as code
disable_ptr_scan = true
disable_secondary = true
# JSR pushes its return address like the 6502: the task scheduler resumes a
# task by popping the yield routine's return (S += 2), and tasks own stacks
push_all_jsr = true

# nmi_tail: the NMI's hijacked return target; body in extras.c (func_C119)
[[replace_func]]
addr = 0xC119

# P4: hand-written routines in port/src/game/
[[replace_func]]
addr = 0xC3B4   # rng_step, rng.c
[[replace_func]]
addr = 0xC279   # read_joypads, input.c
[[replace_func]]
addr = 0xFF4D   # bank_switch, bank.c
[[replace_func]]
addr = 0xC265   # rendering_off, ppu.c
[[replace_func]]
addr = 0xC26F   # rendering_on, ppu.c
[[replace_func]]
addr = 0xF2BE   # object_clear, objects.c
[[replace_func]]
addr = 0xC334   # objects_clear_all, objects.c
[[replace_func]]
addr = 0xC844   # clear_ram_400_5ff, objects.c
[[replace_func]]
addr = 0xF34A   # sound_queue_push, sound.c
