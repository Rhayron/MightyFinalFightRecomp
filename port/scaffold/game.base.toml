[game]
name = "Mighty Final Fight"
output_prefix = "mff"
# the P0 map gives the entry points; the finder's pointer and secondary scans decode data as code
disable_ptr_scan = true
disable_secondary = true
# JSR pushes its return address like the 6502: the task scheduler resumes a
# task by popping the yield routine's return (S += 2), and tasks own stacks
push_all_jsr = true

# nmi_tail: the NMI's hijacked return target; body in extras.c (func_C119)
[[replace_func]]
addr = 0xC119

# P4: hand-written routines in port/src/game/
[[replace_func]]
addr = 0xC3B4   # rng_step, rng.c
[[replace_func]]
addr = 0xC279   # read_joypads, input.c
[[replace_func]]
addr = 0xFF4D   # bank_switch, bank.c
[[replace_func]]
addr = 0xC265   # rendering_off, ppu.c
[[replace_func]]
addr = 0xC26F   # rendering_on, ppu.c
[[replace_func]]
addr = 0xF2BE   # object_clear, objects.c
[[replace_func]]
addr = 0xC334   # objects_clear_all, objects.c
[[replace_func]]
addr = 0xC844   # clear_ram_400_5ff, objects.c
[[replace_func]]
addr = 0xF34A   # sound_queue_push, sound.c
[[replace_func]]
addr = 0xFF24   # task_self_index, tasks.c
[[replace_func]]
addr = 0xFF26   # task_index, tasks.c
[[replace_func]]
addr = 0xFF02   # task_spawn, tasks.c
[[replace_func]]
addr = 0xFF12   # task_kill, tasks.c (never run by a route)
[[replace_func]]
addr = 0xFF1A   # task_exit, tasks.c (never run by a route)
[[replace_func]]
addr = 0xFF31   # task_wait_frame, tasks.c
[[replace_func]]
addr = 0xFF2A   # task_wait_frames, tasks.c
[[replace_func]]
addr = 0xC000   # nmi, interrupts.c
[[replace_func]]
addr = 0xC09D   # nmi_busy, interrupts.c
[[replace_func]]
addr = 0xC1FD   # vram_list_flush, interrupts.c
[[replace_func]]
addr = 0xC201   # vram_list_at, interrupts.c
[[replace_func]]
addr = 0xC222   # nmi_vram_update, interrupts.c
[[replace_func]]
addr = 0xC13B   # irq, interrupts.c
[[replace_func]]
addr = 0xC1D8   # irq_return, interrupts.c
[[replace_func]]
addr = 0xC14A   # irq_status_split, interrupts.c
[[replace_func]]
addr = 0xC194   # irq_split_2, interrupts.c
[[replace_func]]
