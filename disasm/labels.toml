# Names for the generated disassembly (disasm/tools/disasm.py). Every entry
# cites where it was confirmed. bank = 8 KiB PRG bank (MMC3 mode 0: even banks
# at $8000, odd at $A000, $0E fixed at $C000, $0F fixed at $E000).

# ---- vectors (bank $0F, $FFFA-$FFFF) -------------------------------------

[[label]]
bank = 0x0F
addr = 0xFE00
name = "reset"
comment = "RESET vector. SEI/CLD, PPU and APU off, two vblank waits, clears RAM"

[[label]]
bank = 0x0E
addr = 0xC000
name = "nmi"
comment = "NMI vector. Saves A/X/Y, PPUCTRL from $FF, rendering off; $EE|$9A set -> nmi_busy ($C09D)"

[[label]]
bank = 0x0E
addr = 0xC09D
name = "nmi_busy"
comment = "NMI path taken while $EE or $9A is nonzero (read at $C015)"

[[label]]
bank = 0x0E
addr = 0xC13B
name = "irq"
comment = "IRQ vector. Acknowledges the MMC3 IRQ ($E000/$E001) and jumps through ($009C)"

# ---- object slots (16 slots; tables at $0300 + $10*n) -----------------------

[[label]]
bank = 0x0E
addr = 0xC334
name = "objects_clear_all"
comment = "X=$0F..0: zeroes $0300/$0310/$0560/$0470/$04B0/$0320/$0330/$0440/$0450/$0490/$04A0, $0480=$FF"

[[label]]
bank = 0x0F
addr = 0xF2BE
name = "object_clear"
comment = "Zeroes slot X across the object tables ($0300, $0310, $0320 ... $05E0)"

# ---- RAM (not used by the generator yet; names for later passes) -----------

[[ram]]
addr = 0x009C
size = 2
name = "irq_handler"
comment = "IRQ jumps through it (irq, $C147); scenes install their raster split here"

[[ram]]
addr = 0x00FF
name = "ppuctrl_shadow"
comment = "nmi writes it AND #$7F to $2000 ($C009)"

[[ram]]
addr = 0x0030
name = "game_action"
comment = "docs/ram_map.md; $0E = skip stage (verified)"

[[ram]]
addr = 0x0061
name = "round"
comment = "0-based round, docs/ram_map.md (verified)"

[[ram]]
addr = 0x0300
size = 16
name = "obj_state"
comment = "bit 7 = live; slot 0 = player"

[[ram]]
addr = 0x0320
size = 16
name = "obj_id"

[[ram]]
addr = 0x0360
size = 16
name = "obj_x"
comment = "world x, low byte (obj_x_hi $0380 is the high byte); object_draw subtracts the scroll when obj_flags bit 4 is set"

[[ram]]
addr = 0x03C0
size = 16
name = "obj_y"

[[ram]]
addr = 0x0490
size = 16
name = "obj_life"
comment = "current life: damage is subtracted from it (0C:86E4), below 0 is death (0C:80CB, 8111, 8134, 9BA5), the HUD bar fills from it (0F:E8F2); base_cody_round1.flog slot $0C: 40 38 30 22 14 6 -2. Set with obj_life_max at spawn (08:9202, 9215, 9344)"

[[ram]]
addr = 0x04A0
size = 16
name = "obj_life_max"
comment = "maximum life, written only at spawn; the HUD bar length is obj_life_max/8 (0F:E8E0). (The P0 note that Abigail took no damage watched this byte, not obj_life)"

# ---- task scheduler (cooperative, 4 tasks, one stack region each) ----------

[[label]]
bank = 0x0F
addr = 0xFEBA
name = "scheduler"
comment = "main loop: S=$FF, picks a task with state >= 4 from $80+4n; state 8 = new (JMP via $82/$83), else TXS to its saved stack"

[[label]]
bank = 0x0F
addr = 0xFF02
name = "task_spawn"
comment = "A = task, $93/$94 = entry; state 8 (FF26 -> X = A*4)"

[[label]]
bank = 0x0F
addr = 0xFF12
name = "task_kill"
code = true
comment = "A = task: state 0. Never executed in any coverage run"

[[label]]
bank = 0x0F
addr = 0xFF1A
name = "task_exit"
code = true
comment = "current task ($91): state 0, back to scheduler. Never executed in any coverage run"

[[label]]
bank = 0x0F
addr = 0xFF2A
name = "task_wait_frames"
comment = "X frames of task_wait_frame"

[[label]]
bank = 0x0F
addr = 0xFF31
name = "task_wait_frame"
comment = "sleep 1 frame: $81 = 1, state 1, SP -> $82; nmi ($C0E8) counts $81 down and sets state 4"

[[label]]
bank = 0x0F
addr = 0xFF4D
name = "bank_switch"
comment = "MMC3 R6/R7 <- $F4/$F5 (shadows $F2/$F3, select $F0); $F6 reentrancy guard, $F7 deferred"

[[label]]
bank = 0x0E
addr = 0xC0E8
name = "nmi_task_timers"
comment = "for each task in state 1: DEC $81; at 0 -> state 4 (ready)"

[[ram]]
addr = 0x0080
size = 16
name = "tasks"
comment = "4 x {state, timer, sp_or_entry_lo, entry_hi}; state 0 free, 1 sleeping, 2 running, 4 ready, 8 new"

[[ram]]
addr = 0x0091
name = "task_current"
comment = "index of the running task (scheduler $FEDB)"

[[ram]]
addr = 0x0092
name = "frame_counter"
comment = "INC every nmi ($C0E0)"

[[ram]]
addr = 0x00F4
size = 2
name = "bank_request"
comment = "banks wanted at $8000/$A000 (bank_switch)"

# ---- NMI return hijack and sound -----------------------------------------

[[label]]
bank = 0x0E
addr = 0xC0FD
name = "nmi_hijack_return"
comment = "saves the interrupted PC ($0106/$0107 on the stack) in $A0/$A1 and makes RTI return to nmi_tail"

[[label]]
bank = 0x0E
addr = 0xC119
name = "nmi_tail"
comment = "runs after RTI in the interrupted context: fakes a return to $A0/$A1 - 1, calls sound_update, RTS"

[[label]]
bank = 0x0F
addr = 0xFF72
name = "sound_update"
comment = "maps banks 06/07, drains the sound queue into sound_play, calls sound_tick, restores via bank_switch; mid-switch ($F6) -> INC $F7 and bank_switch runs it later"

[[label]]
bank = 0x0F
addr = 0xF34A
name = "sound_queue_push"
comment = "A = sound command into the 8-entry ring at $DC (write index $DA); $88 = empty slot"

[[label]]
bank = 0x06
addr = 0x8000
name = "sound_tick"
comment = "JMP $806C; called once per frame by sound_update"

[[label]]
bank = 0x06
addr = 0x8003
name = "sound_play"
comment = "JMP $80FE; A = command from the queue"

[[label]]
bank = 0x00
addr = 0x8000
name = "player_action_dispatch"
comment = "dispatches on game_action ($30) through the split table lo $8011 / hi $803B (42 entries: $803B - $8011)"

[[label]]
bank = 0x0E
addr = 0xC556
name = "main_task"
comment = "task 0, spawned by reset: S=$BF, sound $F0, LICENSED BY NINTENDO (180 frames), CAPCOM PRESENTS (180, skippable)"

[[label]]
bank = 0x0E
addr = 0xC5B3
name = "rom_integrity_check"
comment = "16 bytes at $FFE0 must equal $C8DD..., $FFF8 must be 8; else hangs at $C5CA (never executed)"

[[ram]]
addr = 0x00A0
size = 2
name = "nmi_return_pc"
comment = "the PC the NMI interrupted (nmi_hijack_return)"

[[ram]]
addr = 0x00DC
size = 8
name = "sound_queue"
comment = "ring of sound commands, $88 = empty (reset fills it)"

[[ram]]
addr = 0x00DA
name = "sound_queue_write"

[[ram]]
addr = 0x00DB
name = "sound_queue_read"

[[ram]]
addr = 0x00F6
name = "bank_switch_busy"

[[ram]]
addr = 0x00F7
name = "sound_deferred"

